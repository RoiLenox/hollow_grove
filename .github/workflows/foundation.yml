name: foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Art asset contract
        run: ./verify-art-assets.sh
      - name: Distribution policy and repository tooling
        run: |
          python3 tools/source_boundary.py
          python3 tools/test_source_boundary.py
          python3 tools/test_prepare_arch_packages.py
          python3 tools/test_hg_distribution.py
          python3 tools/test_hg_machine_audit.py
          python3 tools/test_source_inventory.py
          python3 tools/test_active_geography.py
          python3 tools/test_registrar_generation.py
          python3 tools/build_registrar.py --check
          python3 tools/verify-active-geography.py
          python3 tools/hg-distribution.py audit
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test runtime without optional developer tools
        run: cargo test --workspace --locked
      - name: Test workspace including developer tools and graphical client
        run: cargo test --workspace --all-features --locked
      - name: Repository whitespace
        run: git diff --check

  arch-source:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Prepare unprivileged source validation
        run: |
          pacman -Syu --noconfirm --needed git python
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Test isolated source bundles and generate recipes
        run: |
          runuser -u builder -- python3 tools/test_prepare_arch_packages.py
          runuser -u builder -- python3 tools/prepare-arch-packages.py
          for recipe in dist/arch-packages/*/PKGBUILD; do
            bash -n "$recipe"
          done
