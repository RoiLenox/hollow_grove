schema_version = 2
resolver = "/usr/bin/hollow-launch"
governing_rule = "Key = WHAT · Modifier = HOW"

[classifications]
required_base = "Installed in the General Edition base image."
hollow_grove = "Provided by a project-owned package or installed command."
general = "Reasonable desktop software; may be selected by the image profile."
optional = "Binding is retained, but absence produces a clear notification."
empty = "The semantic branch is reserved but intentionally has no application."
excluded = "Personal, hardware-specific, obsolete, or unsuitable for distribution."

[required_base]
arch_packages = [
  "bash",
  "coreutils",
  "curl",
  "dbus",
  "jq",
  "kitty",
  "libnotify",
  "mako",
  "networkmanager",
  "niri",
  "polkit-gnome",
  "swaybg",
  "swaylock",
  "systemd",
  "util-linux",
  "waybar",
  "wireplumber",
  "wl-clipboard",
  "cliphist",
  "brightnessctl",
  "playerctl",
  "grim",
  "slurp",
  "bluez",
  "bluez-utils",
  "blueman",
  "network-manager-applet",
  "udisks2",
  "xwayland-satellite",
  "xdg-desktop-portal-gnome",
  "xdg-desktop-portal-gtk",
  "xdg-utils",
]

[[family]]
key = "A"
meaning = "AI"
memory_hook = "Artificial intelligence"
bindings = ["Mod+A", "Mod+Shift+A", "Mod+Ctrl+A", "Mod+Alt+A"]
commands = ["opencode", "codex", "hollow-ai", "ollama", "python3", "kitty", "gemini", "aichat"]
classification = "optional"

[[family]]
key = "B"
meaning = "Browse"
memory_hook = "Web"
bindings = ["Mod+B", "Mod+Shift+B", "Mod+Ctrl+B", "Mod+Alt+B"]
commands = ["firefox", "chromium", "vivaldi-stable", "brave"]
classification = "optional"

[[family]]
key = "C"
meaning = "Code"
memory_hook = "Source code"
bindings = ["Mod+C", "Mod+Shift+C", "Mod+Ctrl+C"]
commands = ["lapce", "kitty", "helix", "zeditor"]
classification = "optional"

[[family]]
key = "D"
meaning = "Downloads"
memory_hook = "Acquire files"
bindings = ["Mod+D", "Mod+Shift+D"]
commands = ["qbittorrent", "kitty", "rtorrent"]
classification = "optional"

[[family]]
key = "E"
meaning = "Email"
memory_hook = "Mail"
bindings = ["Mod+E", "Mod+Shift+E", "Mod+Ctrl+E"]
commands = ["thunderbird", "kitty", "himalaya"]
classification = "optional"

[[family]]
key = "F"
meaning = "Files"
memory_hook = "Filesystem"
bindings = ["Mod+F", "Mod+Shift+F", "Mod+Ctrl+F", "Mod+Alt+F"]
commands = ["yazi", "nautilus", "dolphin", "pcmanfm-qt"]
classification = "optional"

[[family]]
key = "G"
meaning = "Games"
memory_hook = "PLAY"
bindings = ["Mod+G", "Mod+Shift+G", "Mod+Ctrl+G", "Mod+Alt+G"]
commands = ["steam", "rpcs3", "dolphin-emu", "retroarch"]
classification = "optional"

[[family]]
key = "I"
meaning = "Inspect"
memory_hook = "Look inside"
bindings = ["Mod+I", "Mod+Shift+I", "Mod+Ctrl+I", "Mod+Alt+I"]
commands = ["kitty", "htop", "fastfetch", "sensors", "journalctl"]
classification = "optional"

[[family]]
key = "M"
meaning = "Music"
memory_hook = "HEAR"
bindings = ["Mod+M", "Mod+Shift+M", "Mod+Ctrl+M", "Mod+Alt+M"]
commands = ["audiotube", "youtui", "spotify-launcher", "spicetify", "hollow-spotify", "spt", "kitty"]
classification = "optional"

[[family]]
key = "N"
meaning = "Network"
memory_hook = "Connections"
bindings = ["Mod+N", "Mod+Shift+N", "Mod+Ctrl+N", "Mod+Alt+N"]
commands = ["kitty", "nmtui", "nm-connection-editor", "nmcli", "ssh", "hollow-network-ssh"]
classification = "optional"

[[family]]
key = "O"
meaning = "Office"
memory_hook = "Productivity"
bindings = ["Mod+O", "Mod+Shift+O", "Mod+Ctrl+O", "Mod+Alt+O"]
commands = ["libreoffice"]
classification = "general"

[[family]]
key = "P"
meaning = "Photos"
memory_hook = "Photography"
bindings = ["Mod+P", "Mod+Shift+P", "Mod+Ctrl+P"]
commands = ["imv", "digikam", "darktable"]
classification = "optional"

[[family]]
key = "Q"
meaning = "Query"
memory_hook = "Find information"
bindings = ["Mod+Q", "Mod+Shift+Q", "Mod+Ctrl+Q"]
commands = ["kitty", "python3", "hollow-query", "fzf", "rg", "bat", "xdg-open", "less", "man", "apropos"]
classification = "optional"

[[family]]
key = "R"
meaning = "Record"
memory_hook = "Capture"
bindings = ["Mod+R", "Mod+Shift+R", "Mod+Ctrl+R", "Mod+Alt+R"]
commands = ["Waveform13", "ardour", "audacity", "reaper"]
classification = "optional"

[[family]]
key = "S"
meaning = "Settings"
memory_hook = "Configure"
bindings = ["Mod+S", "Mod+Shift+S", "Mod+Alt+S"]
commands = ["kitty", "helix", "blueman-manager", "pwvucontrol"]
classification = "optional"

[[family]]
key = "T"
meaning = "Time"
memory_hook = "Clock and timing"
bindings = ["Mod+T", "Mod+Shift+T", "Mod+Ctrl+T", "Mod+Alt+T"]
commands = ["kitty", "peaclock", "gnome-clocks", "python3", "hollow-time", "tclock", "tty-clock"]
classification = "optional"

[[family]]
key = "U"
meaning = "Utilities"
memory_hook = "System tools"
bindings = ["Mod+U", "Mod+Shift+U", "Mod+Ctrl+U", "Mod+Alt+U"]
commands = ["btop", "ncdu", "nvtop", "battop"]
classification = "optional"

[[family]]
key = "V"
meaning = "Videos"
memory_hook = "WATCH"
bindings = ["Mod+V", "Mod+Shift+V", "Mod+Ctrl+V", "Mod+Alt+V"]
commands = ["python3", "hollow-video", "kodi", "xdg-open", "zenity", "mpv", "freetube"]
classification = "optional"

[[family]]
key = "W"
meaning = "Wrappers"
memory_hook = "Windows compatibility"
bindings = ["Mod+W", "Mod+Shift+W", "Mod+Ctrl+W", "Mod+Alt+W"]
commands = ["python3", "hollow-wrappers", "flatpak", "zenity", "protontricks", "yad"]
classification = "optional"

[[family]]
key = "X"
meaning = "eXecute"
memory_hook = "Run commands and workflows"
bindings = ["Mod+X", "Mod+Shift+X", "Mod+Ctrl+X"]
commands = ["kitty", "python3", "hollow-execute", "fzf"]
classification = "optional"

[[family]]
key = "Y"
meaning = "sYnc"
memory_hook = "Folder/device sync"
bindings = ["Mod+Y", "Mod+Shift+Y", "Mod+Ctrl+Y"]
commands = ["syncthing", "grsync", "systemctl", "xdg-open", "kitty", "python3", "hollow-sync"]
classification = "optional"

[[family]]
key = "Z"
meaning = "Zip"
memory_hook = "Archives"
bindings = ["Mod+Z", "Mod+Shift+Z", "Mod+Ctrl+Z", "Mod+Alt+Z"]
commands = ["file-roller", "python3", "hollow-zip", "zenity", "kitty", "bsdtar"]
classification = "optional"

[[special_application]]
role = "terminal"
bindings = ["Mod+Return", "Mod+Shift+Return", "Mod+Ctrl+Return"]
commands = ["kitty", "bash", "zellij"]
classification = "general"

[[special_application]]
role = "hueman"
bindings = ["Mod+Alt+Return", "Mod+Alt+KP_Enter", "Mod+Alt+Ctrl+Return", "Mod+Alt+BackSpace", "Mod+Alt+Shift+Space"]
commands = ["hollow-hueman"]
classification = "hollow_grove"

[[special_application]]
role = "navigate"
bindings = ["Mod+Grave"]
commands = ["walker"]
classification = "optional"

[[special_application]]
role = "media-and-capture"
bindings = ["Mod+Shift+Comma", "Mod+Shift+Period", "Print", "Mod+Shift+Equal", "Mod+Ctrl+Minus", "Mod+Ctrl+Equal", "XF86Audio*"]
commands = ["playerctl", "hollow-media", "niri", "obs", "grim", "slurp", "wl-copy", "wpctl"]
classification = "optional"

[[special_application]]
role = "nested-river-development"
bindings = ["Mod+Alt+Escape", "Mod+Alt+Shift+Return", "Mod+Alt+Slash"]
commands = ["river-scope-close", "river-scope-spawn", "river-kitty", "river-scope-probe"]
classification = "optional"

[[excluded]]
item = "personal browser, mail, and service state"
reason = "No profile, credentials, or personal account data belongs in the image."

[[excluded]]
item = "personal weather coordinates and wallpaper"
reason = "The portable profile keeps machine- and user-owned settings blank."

[[excluded]]
item = "unrelated fruit for an empty semantic branch"
reason = "An absent implementation remains empty instead of weakening WHAT/HOW recall."
