[package]
name = "hollow-grove"
version = "0.1.0"
edition = "2024"
default-run = "hollow-grove"
autobins = false
publish = false
license-file = "LICENSE"

[workspace]
members = [
    ".",
    "hollow-grove-recursion-kernel",
    "hollow-grove-semantic-kernel",
    "officials-and-outlaws",
]
resolver = "3"

[dependencies]
hollow-grove-recursion-kernel = { path = "hollow-grove-recursion-kernel" }
hollow-grove-semantic-kernel = { path = "hollow-grove-semantic-kernel" }
flynt-constitution = { path = "officials-and-outlaws" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
[features]
default = []
dev-tools = []

[[bin]]
name = "hollow-grove"
path = "src/main.rs"

[[bin]]
name = "current_synthesis_tui"
path = "src/bin/current_synthesis_tui.rs"

[[bin]]
name = "guide_transition_audit"
