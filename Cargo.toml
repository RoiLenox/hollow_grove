[package]
name = "hollow-grove"
version = "0.1.0"
edition = "2024"
default-run = "hollow-grove"
autobins = false
autotests = false
publish = false
license-file = "LICENSE"

[workspace]
members = [
    ".",
    "hollow-niri",
    "hollow-grove-recursion-kernel",
    "hollow-grove-semantic-kernel",
    "officials-and-outlaws",
]
exclude = ["fuzz"]
resolver = "3"

[dependencies]
hollow-niri = { path = "hollow-niri" }
hollow-grove-recursion-kernel = { path = "hollow-grove-recursion-kernel" }
hollow-grove-semantic-kernel = { path = "hollow-grove-semantic-kernel" }
flynt-constitution = { path = "officials-and-outlaws" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles"], optional = true }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"], optional = true }
[features]
default = []
dev-tools = []
graphical-client = ["dep:wgpu", "dep:winit"]

[[bin]]
name = "hollow-grove"
path = "src/main.rs"

[[bin]]
name = "hollow_deck"
path = "src/bin/hollow_deck.rs"

[[bin]]
name = "adaptive_topology_live"
path = "src/bin/adaptive_topology_live.rs"

[[bin]]
name = "current_synthesis_tui"
path = "src/bin/current_synthesis_tui.rs"

[[bin]]
name = "guide_transition_audit"
path = "src/bin/guide_transition_audit.rs"

[[bin]]
name = "hollow_grove_game_service"
path = "src/bin/hollow_grove_game_service.rs"

[[bin]]
name = "hollow_grove_niri_bridge"
path = "src/bin/hollow_grove_niri_bridge.rs"

[[bin]]
name = "hollow_grove_runtime"
path = "src/bin/hollow_grove_runtime.rs"

[[bin]]
name = "hollow_grove_semantic"
path = "src/bin/hollow_grove_semantic.rs"

[[bin]]
name = "hollow-grove-client"
path = "src/bin/hollow_grove_client.rs"
required-features = ["graphical-client"]

[[bin]]
name = "hg-dev"
path = "src/bin/hg_dev.rs"
required-features = ["dev-tools"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "hollow_deck"
path = "tests/hollow_deck.rs"

[[test]]
name = "hollow_deck_state"
path = "tests/hollow_deck_state.rs"

[[test]]
name = "deep_pressure_campaign"
path = "tests/deep_pressure_campaign.rs"

[[test]]
name = "gameplay_boardwalk"
path = "tests/gameplay_boardwalk.rs"

[[test]]
name = "guide_operational_seam"
path = "tests/guide_operational_seam.rs"

[[test]]
name = "institutional_boundary"
path = "tests/institutional_boundary.rs"

[[test]]
name = "party_recruitment"
path = "tests/party_recruitment.rs"

[[test]]
name = "runtime_rampart_documentation"
path = "tests/runtime_rampart_documentation.rs"

[[test]]
name = "runtime_rampart_v1"
path = "tests/runtime_rampart_v1.rs"

[[test]]
name = "graphical_client"
path = "tests/graphical_client.rs"
required-features = ["graphical-client"]


[profile.dev]
debug = 1

[profile.test]
debug = 1
incremental = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
